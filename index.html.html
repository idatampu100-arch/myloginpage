<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Montserrat;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
    }
    .isian {
      width: 200px;
      padding: 10px;
      border-radius: 10px;
      border: 3px solid blue;
    }
    .tom {
      width: 100px;
      padding: 10px;
      border-radius: 30px;
      background-color: blue;
      color: white;
      transition: background-color 0.3s ease;
      cursor: pointer;
    }
    .tom:hover {
      background-color: cyan;
    }
    .lower {
      width: 100%;
      height: auto;
      display: block;
      background-color: lightslategray;
      color: white;
      position: fixed;
      margin-top: 400px;
      
    }
    .link {
      color: white;
      text-decoration: none;
    }
    .link:hover {
      text-decoration: underline;
    }

  </style>
</head>
<body>
  
  <h1>GreatAccounts</h1>
  <p>Silahkan <u>Login</u> ke <b>Great</b>Healt dan aplikasi lainnya yang berawalan <b>Great</b>... .</p>
  
  <div id="isian-login">
    <input id="username" type="text" class="isian" placeholder="Masukkan Username..." required>
    <input id="password" type="password" class="isian" placeholder="Masukkan password" required>
    <button onclick="SembunyiDanPergi()" class="tom">Masuk</button>
  </div>
  <div class="lower">
    <p>&copy; 2025 <b>Great</b>Healt - All rights reversed | <a href="https://greathealt.oneapp.dev" target="_blank" class="link"><b>Great</b>Healt</a></p>
  </div>
  <script>
  function SembunyiDanPergi() {
    var user = document.getElementById('username').value.trim();
    var pass = document.getElementById('password').value.trim();
    if (!user || !pass) {
      alert('Username dan Password harus diisi!');
      return;
    }
    document.getElementById('isian-login').style.display = 'none';
    window.location.href = "https://greathealt.oneapp.dev";
  }
  </script>

</body>
</html>
